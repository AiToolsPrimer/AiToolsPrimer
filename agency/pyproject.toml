[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitoolsprimer-agency"
version = "0.1.0"
description = "Local, token-free AI marketing agency: a director model plus specialist agents that write, design, film, voice and publish through official platform APIs."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agency = "agency.cli:main"

[tool.setuptools.packages.find]
include = ["agency*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
