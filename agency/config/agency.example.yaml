# Copy to config/agency.yaml. Secrets go in .env, never here.
dry_run: true              # nothing leaves the Mac until you set this to false
panel_host: 127.0.0.1
panel_port: 8765
ui_language: en

brand:
  name: AI Tools Primer
  site: https://aitoolsprimer.com
  tagline: Independent, plain-English guides to AI tools and everyday software.
  language: en
  audience: People choosing and using AI tools and everyday software.
  voice: >-
    Plain English, specific, verified. No hype, no affiliate links, no paid placements.
    Say when something was checked; say when it could not be verified.
  pillars:
    - AI tools compared and explained
    - Documents, PDF, images, video software
    - Windows, Mac and iPhone how-tos
    - Passwords, scams, malware, data leaks
  handles:
    youtube: "@aitoolsprimer"
    bluesky: aitoolsprimer.bsky.social
    mastodon: "@aitoolsprimer@mastodon.social"
    x: aitoolsprimer
    hashnode: aitoolsprimer.hashnode.dev
    medium: "@aitoolsprimer"
  banned_claims: ["guaranteed", "best in the world", "#1", "100% safe"]

hardware:
  profile: m5pro-64gb      # m5pro-64gb (brain A) | m5pro-64gb-b (27B only) | 128gb | 32gb
  unified_memory_gb: 64
  gpu_budget_gb: 56        # after `sudo sysctl iogpu.wired_limit_mb=57344`
  one_model_at_a_time: true
  models_dir: ""          # where the model files live; "" = ~/models. AGENCY_MODELS in .env wins (e.g. /Volumes/AI/models on an external SSD)

models:
  brain: auto              # auto = the doctor benchmark decides between Flash-Next and the 27B | flash-next | 27b
  team_mode: team          # team = brain + second pen, brain judges | best_of_n | single
  thinking_effort: xhigh   # brain decisions, judging, fact-check
  draft_effort: medium     # first drafts
  candidates_per_draft: 2
  overrides: {}            # task -> model name from the registry, e.g. {tts: "Kokoro 82M"}

runtimes:
  lmstudio_url: http://127.0.0.1:1234
  llamacpp_port: 8081
  comfyui_url: http://127.0.0.1:8188
  acestep_url: http://127.0.0.1:7867
  lms_cli: lms
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  python: python3

video:
  max_seconds: 240         # four minutes
  clip_seconds: 8          # native LTX-2.5 clip; looped/cut to the narration length
  fps: 24
  width: 1920
  height: 1080
  shorts_seconds: 45
  music_db: -18
  subtitles: sidecar       # burned | sidecar | none
  default_visual_mode: mixed   # generated | image_motion | mixed

media:
  image_command: ""        # empty = mflux template from the registry; "comfyui" = ComfyUI workflow
  image_steps: 20
  video_command: ""        # empty = LTX-2.5 MLX template (or workflows/video.json when present)
  tts_voice: default       # path to a 3-10 s WAV to clone (Step-Audio-EditX / Chatterbox), or a Kokoro voice id like af_heart
  music_endpoint: /generate
  presenter_image: config/presenter.png   # optional photo for 'presenter' scenes
  podcast_base_url: ""     # public URL of the folder where you host assets/podcast (feed.xml and MP3s)

browser:
  headless: false          # the operator's Chrome window stays visible on the Mac
  channel: chrome          # installed Google Chrome; set "" to use Playwright's Chromium
  executable: ""
  profile_dir: state/chrome-profile
  pace_seconds: 0.6
  actions_per_day: 15

limits:
  posts_per_platform_per_day: 4
  replies_per_platform_per_hour: 10
  articles_per_week: 3
  videos_per_week: 3
  quiet_hours_utc: [1, 6]
  max_revisions: 2
  browser_actions_per_day: 15

director:
  provider: local          # local | anthropic (paid, needs ANTHROPIC_API_KEY; off by default)
  anthropic_model: claude-fable-5-1
  daily_cycle_utc: "07:30"
  community_every_minutes: 30
  analyst_daily_utc: "22:00"
  scout_weekly: "mon 09:00"

platforms:
  reddit:
    extra: {subreddit: u_aitoolsprimer}
  substack:
    extra: {publication: aitoolsprimer}     # the subdomain of your Substack
  blogger:
    extra: {blog_id: ""}
  # mode per platform: api | browser | intent | manual | off (defaults: X/Medium/Substack/LinkedIn Articles/Blogger/Dailymotion = browser,
  # Reddit/Quora/HN/Stack Exchange = manual, Flipboard = intent, everything else = api). Changeable from the dashboard.
